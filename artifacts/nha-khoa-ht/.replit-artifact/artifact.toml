kind = "web"
previewPath = "/"
title = "Nha Khoa HT"
version = "1.0.0"
id = "artifacts/nha-khoa-ht"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24344

[services.development]
run = "pnpm --filter @workspace/nha-khoa-ht run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nha-khoa-ht", "run", "build" ]
publicDir = "artifacts/nha-khoa-ht/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24344"
BASE_PATH = "/"
